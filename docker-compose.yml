name: ${COMPOSE_PROJECT_NAME:-camsme-inventory}

services:
  react-app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
        VITE_BASE_API_URL: ${VITE_BASE_API_URL}
    container_name: ${FRONTEND_CONTAINER_NAME:-camsme-inventory-frontend}
    restart: unless-stopped
    ports:
      - "${FRONTEND_BIND_IP:-127.0.0.1}:${FRONTEND_PORT:-8081}:80"
